on:
  schedule:
    - cron: "0 12 * * 1,3,5"
    - cron: "53 21 * * 2,4"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch override (auto = use BRANCH_BY_CRON)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - main
          - release
      simulate_schedule:
        description: "Pretend this cron fired (only used when branch = auto)"
        required: true
        type: choice
        default: "0 12 * * 1,3,5"
        options:
          - "0 12 * * 1,3,5"
          - "53 21 * * 2,4"

# env: BRANCH_BY_CRON unchanged

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pick.outputs.branch }}
    steps:
      - id: pick
        env:
          SCHEDULE: ${{ github.event.schedule || inputs.simulate_schedule }}
          OVERRIDE: ${{ inputs.branch != 'auto' && inputs.branch || '' }}
          BRANCH: ${{ (inputs.branch != 'auto' && inputs.branch) || fromJSON(env.BRANCH_BY_CRON)[github.event.schedule || inputs.simulate_schedule] || 'main' }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule used: $SCHEDULE"
          echo "Override: '$OVERRIDE'"
          echo "Branch to test: $BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  hello:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Branch to test: ${{ needs.resolve.outputs.branch }}"

  checkout:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ needs.resolve.outputs.branch }}