name: CronTests Release
on:
  schedule:
    # 6am Costa Rica time (UTC-6, no daylight saving time)
    - cron: "0 12 * * 1,3,5"   # Mon, Wed, Fri: master
    - cron: "0 22 * * 2,4"     # Tue, Thu: release_v26.06
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        type: choice
        default: main
        options:
          - main
          - release

permissions:
  contents: read
  checks: write

env:
  # Branch to test for each scheduled run, by the cron line that starts it. The branch to test
  # never depends on the branch the workflow file lives in. Copy each cron line exactly from
  # "on: schedule:" and do not end the last entry with a comma.
  BRANCH_BY_CRON: |
    {
      "0 12 * * 1,3,5": "release",
      "0 22 * * 2,4": "main"
    }

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello world
        run: |
          echo "Hello world"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Branch to test: ${{ inputs.branch || fromJSON(env.BRANCH_BY_CRON)[github.event.schedule] || 'main' }}"
  
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch || fromJSON(env.BRANCH_BY_CRON)[github.event.schedule] || 'main' }}